<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-label="关于我 - 你好，我是 PlutoNebula。正在忙一些有意思的项目；正在学习 Gin；联系方式 642476404@qq.com；博客 plutoze.xyz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170a08"/>
