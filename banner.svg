<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="PlutoNebula - wandering full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170a08"/>
      <stop offset="0.5" stop-color="#2e1009"/>
      <stop offset="1" stop-color="#150a1d"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb877"/>
      <stop offset="0.55" stop-color="#ff8e4d"/>
      <stop offset="1" stop-color="#8fd0ff"/>
    </linearGradient>
    <radialGradient id="nebGlow">
      <stop offset="0" stop-color="#ff9355" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff9355" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iceGlow">
      <stop offset="0" stop-color="#8fd0ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8fd0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cometHead">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffd9a0"/>
      <stop offset="0.7" stop-color="#ff8e4d"/>
      <stop offset="1" stop-color="#ff8e4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tailGrad" gradientUnits="userSpaceOnUse" x1="126" y1="26" x2="-165" y2="55">
      <stop offset="0" stop-color="#ff9355" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9355" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tailGrad2" gradientUnits="userSpaceOnUse" x1="130" y1="12" x2="-118" y2="138">
      <stop offset="0" stop-color="#8fd0ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8fd0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd9a0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- deep-space background -->
  <rect width="1280" height="380" fill="url(#bg)"/>
  <ellipse cx="985" cy="205" rx="250" ry="150" fill="url(#nebGlow)"/>
  <ellipse cx="1180" cy="80" rx="170" ry="110" fill="url(#iceGlow)"/>
  <ellipse cx="150" cy="330" rx="200" ry="120" fill="url(#nebGlow)" opacity="0.6"/>

  <!-- banner-wide sweep beam -->
  <g transform="rotate(16 640 190)">
    <rect x="-420" y="-180" width="220" height="740" fill="url(#beamGrad)">
      <animate attributeName="x" from="-420" to="1700" dur="9.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- particle field across the whole canvas -->
  <g>
    <circle cx="430.3" cy="231.3" r="2.24" fill="#ffe3bd" opacity="0.55"><animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0; 6 -4; 0 0" dur="10.1s" repeatCount="indefinite"/></circle>
    <circle cx="630.5" cy="268.3" r="1.35" fill="#a8d8ff" opacity="0.59"><animate attributeName="opacity" values="0.59;0.24;0.59" dur="2.7s" repeatCount="indefinite"/></circle>
