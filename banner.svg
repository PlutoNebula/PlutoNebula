    <circle cx="920.6" cy="37.0" r="1.69" fill="#a8d8ff" opacity="0.8"><animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0; -5 -5; 0 0" dur="12.0s" repeatCount="indefinite"/></circle>
    <circle cx="557.5" cy="57.8" r="2.15" fill="#ffe3bd" opacity="0.73"><animate attributeName="opacity" values="0.73;0.38;0.73" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="484.7" cy="31.2" r="2.14" fill="#a8d8ff" opacity="0.49"><animate attributeName="opacity" values="0.49;0.14;0.49" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="848.8" cy="34.3" r="0.95" fill="#a8d8ff" opacity="0.36"><animate attributeName="opacity" values="0.36;0.05;0.36" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="190.0" cy="18.3" r="0.88" fill="#ffe3bd" opacity="0.58"><animate attributeName="opacity" values="0.58;0.23;0.58" dur="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="16.9" cy="101.0" r="1.04" fill="#a8d8ff" opacity="0.55"><animate attributeName="opacity" values="0.55;0.2;0.55" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="76.1" cy="169.7" r="1.57" fill="#ffe3bd" opacity="0.33"><animate attributeName="opacity" values="0.33;0.05;0.33" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="700.7" cy="65.4" r="1.12" fill="#ffffff" opacity="0.31"><animate attributeName="opacity" values="0.31;0.05;0.31" dur="4.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0; 8 2; 0 0" dur="8.6s" repeatCount="indefinite"/></circle>
    <circle cx="1123.4" cy="149.0" r="0.88" fill="#a8d8ff" opacity="0.48"><animate attributeName="opacity" values="0.48;0.13;0.48" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="269.1" cy="49.6" r="1.26" fill="#ffffff" opacity="0.48"><animate attributeName="opacity" values="0.48;0.13;0.48" dur="4.1s" repeatCount="indefinite"/></circle>
