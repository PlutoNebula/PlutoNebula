  <!-- HERO: the wanderer comet on its trajectory, gliding past waypoint stars -->
  <g transform="translate(985,205)">
    <ellipse cx="30" cy="20" rx="215" ry="135" fill="url(#nebGlow)"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="5.5s" repeatCount="indefinite"/>
      <!-- open trajectory (dashed, travelling) -->
      <path d="M -230 160 Q 40 210 240 -120" fill="none" stroke="#8fd0ff" stroke-width="4" stroke-dasharray="2 18" stroke-linecap="round" opacity="0.6">
        <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <!-- waypoint stars along the trajectory -->
      <g transform="translate(-125,165)">
        <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#ffd9a0" filter="url(#glow)">
          <animate attributeName="opacity" values="0.35;1;0.35" dur="3.1s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(30,125)">
        <path d="M 0 -7 L 2 -2 L 7 0 L 2 2 L 0 7 L -2 2 L -7 0 L -2 -2 Z" fill="#a8d8ff" filter="url(#glow)">
          <animate attributeName="opacity" values="1;0.3;1" dur="4.2s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(215,-95)">
        <path d="M 0 -9 L 2.5 -2.5 L 9 0 L 2.5 2.5 L 0 9 L -2.5 2.5 L -9 0 L -2.5 -2.5 Z" fill="#ff9355" filter="url(#glow)">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- stardust tail -->
      <path d="M 126 26 C 60 70 -40 120 -165 55" fill="none" stroke="url(#tailGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.5;0.85" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M 130 12 C 80 62 -10 92 -118 138" fill="none" stroke="url(#tailGrad2)" stroke-width="6" stroke-linecap="round" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 124 22 C 86 54 26 82 -24 104" fill="none" stroke="#ffd9a0" stroke-width="6" stroke-linecap="round" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.9s" repeatCount="indefinite"/>
      </path>
      <!-- comet head -->
      <circle cx="135" cy="20" r="32" fill="url(#cometHead)" opacity="0.6">
        <animate attributeName="r" values="32;40;32" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="135" cy="20" r="13" fill="#fff7ea" filter="url(#glow)"/>
    </g>
  </g>

  <!-- title block -->
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
    <circle cx="66" cy="116" r="24" fill="url(#nebGlow)">
      <animate attributeName="r" values="20;36;20" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="142" font-size="58" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)">PlutoNebula</text>
    <line x1="84" y1="158" x2="470" y2="158" stroke="url(#titleGrad)" stroke-width="3.5" stroke-dasharray="390" stroke-dashoffset="390">
      <animate attributeName="stroke-dashoffset" values="390;0" dur="2.8s" fill="freeze"/>
    </line>
    <text x="82" y="188" font-size="20" fill="#f0cba4" opacity="0.95">&#10022; Not all those who wander are lost &#10022;</text>
    <text x="82" y="216" font-size="15" fill="#9fb6c9">Full-Stack Developer &#183; Vue / TypeScript &#183; Node.js / Python / Go</text>
    <g font-size="14">
      <rect x="82" y="240" width="178" height="32" rx="16" fill="#ff9355" fill-opacity="0.08" stroke="#ff9355" stroke-opacity="0.75" stroke-width="1.5"/>
      <text x="171" y="261" text-anchor="middle" fill="#ffcf9e">Vue &#183; TypeScript</text>
      <rect x="272" y="240" width="212" height="32" rx="16" fill="#ff9355" fill-opacity="0.08" stroke="#ff9355" stroke-opacity="0.75" stroke-width="1.5"/>
      <text x="378" y="261" text-anchor="middle" fill="#ffcf9e">Node.js &#183; Python &#183; Go</text>
      <rect x="496" y="240" width="132" height="32" rx="16" fill="#8fd0ff" fill-opacity="0.08" stroke="#8fd0ff" stroke-opacity="0.75" stroke-width="1.5"/>
      <text x="562" y="261" text-anchor="middle" fill="#a8d8ff">plutoze.xyz</text>
    </g>
  </g>
</svg>
