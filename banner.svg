    <circle cx="590.9" cy="258.5" r="1.76" fill="#ffe3bd" opacity="0.84"><animate attributeName="opacity" values="0.84;0.49;0.84" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="419.5" cy="141.2" r="2.32" fill="#ffffff" opacity="0.26"><animate attributeName="opacity" values="0.26;0.05;0.26" dur="2.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0; -4 7; 0 0" dur="11.7s" repeatCount="indefinite"/></circle>
    <circle cx="1151.2" cy="24.7" r="1.2" fill="#ffe3bd" opacity="0.55"><animate attributeName="opacity" values="0.55;0.2;0.55" dur="5.3s" repeatCount="indefinite"/></circle>
    <circle cx="562.7" cy="76.1" r="0.85" fill="#ffffff" opacity="0.75"><animate attributeName="opacity" values="0.75;0.4;0.75" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="883.0" cy="300.3" r="1.92" fill="#a8d8ff" opacity="0.63"><animate attributeName="opacity" values="0.63;0.28;0.63" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="529.2" cy="229.2" r="2.07" fill="#ffe3bd" opacity="0.61"><animate attributeName="opacity" values="0.61;0.26;0.61" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="728.3" cy="272.3" r="1.44" fill="#ffe3bd" opacity="0.41"><animate attributeName="opacity" values="0.41;0.06;0.41" dur="5.0s" repeatCount="indefinite"/></circle>
    <circle cx="341.5" cy="40.2" r="2.3" fill="#ffffff" opacity="0.76"><animate attributeName="opacity" values="0.76;0.41;0.76" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="613.2" cy="181.1" r="2.31" fill="#ffe3bd" opacity="0.61"><animate attributeName="opacity" values="0.61;0.26;0.61" dur="3.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0; 6 5; 0 0" dur="10.3s" repeatCount="indefinite"/></circle>
    <circle cx="356.5" cy="189.1" r="1.85" fill="#ffffff" opacity="0.46"><animate attributeName="opacity" values="0.46;0.11;0.46" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1088.3" cy="320.5" r="1.01" fill="#ffe3bd" opacity="0.63"><animate attributeName="opacity" values="0.63;0.28;0.63" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="861.2" cy="357.3" r="2.16" fill="#ffe3bd" opacity="0.28"><animate attributeName="opacity" values="0.28;0.05;0.28" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1255.7" cy="80.6" r="2.15" fill="#ffffff" opacity="0.75"><animate attributeName="opacity" values="0.75;0.4;0.75" dur="3.7s" repeatCount="indefinite"/></circle>
