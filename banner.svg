    <circle cx="514.0" cy="319.8" r="2.39" fill="#ffe3bd" opacity="0.26"><animate attributeName="opacity" values="0.26;0.05;0.26" dur="3.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0; 4 6; 0 0" dur="9.2s" repeatCount="indefinite"/></circle>
    <circle cx="550.8" cy="296.0" r="2.18" fill="#ffe3bd" opacity="0.74"><animate attributeName="opacity" values="0.74;0.39;0.74" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="907.9" cy="167.4" r="1.25" fill="#ffffff" opacity="0.67"><animate attributeName="opacity" values="0.67;0.32;0.67" dur="3.2s" repeatCount="indefinite"/></circle>
