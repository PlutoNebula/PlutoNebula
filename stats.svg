<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" role="img" aria-label="GitHub 数据统计">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170a08"/>
      <stop offset="0.5" stop-color="#2e1009"/>
      <stop offset="1" stop-color="#150a1d"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb877"/>
      <stop offset="0.55" stop-color="#ff8e4d"/>
      <stop offset="1" stop-color="#8fd0ff"/>
    </linearGradient>
    <radialGradient id="nebGlow">
      <stop offset="0" stop-color="#ff9355" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ff9355" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iceGlow">
      <stop offset="0" stop-color="#8fd0ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8fd0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="704" height="134" rx="24" fill="url(#bg)" stroke="#8fd0ff" stroke-opacity="0.18" stroke-width="1.5"/>
  <ellipse cx="120" cy="40" rx="180" ry="70" fill="url(#nebGlow)"/>
  <ellipse cx="620" cy="112" rx="160" ry="70" fill="url(#iceGlow)"/>

  <g fill="#ffe3bd">
    <circle cx="70" cy="90" r="1.5" opacity="0.55"><animate attributeName="opacity" values="0.55;0.15;0.55" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="50" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="4.1s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#a8d8ff">
    <circle cx="560" cy="120" r="1.6" opacity="0.5"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="30" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Arial,sans-serif">
    <circle cx="188" cy="64" r="12" fill="url(#nebGlow)"><animate attributeName="r" values="10;18;10" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="532" cy="64" r="10" fill="url(#iceGlow)"><animate attributeName="r" values="8;15;8" dur="4.2s" repeatCount="indefinite"/></circle>
    <text x="360" y="70" font-size="28" font-weight="700" fill="url(#titleGrad)" text-anchor="middle" filter="url(#glow)">GitHub 数据</text>
    <line x1="230" y1="90" x2="490" y2="90" stroke="url(#titleGrad)" stroke-width="2" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" values="260;0" dur="2.5s" fill="freeze"/>
    </line>
    <text x="360" y="112" font-size="11" fill="#9fb6c9" text-anchor="middle" letter-spacing="6">STATS &amp; ACTIVITY</text>
  </g>
</svg>
